<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image source</title>
<!--
  Source for assets/og-image.png (1200 × 630 link-preview image).
  Regenerate after editing (Chrome needs absolute paths):
    "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --screenshot="<repo path>/assets/og-image.png" "file:///<repo path>/tools/og-image.html"
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #ffffff;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.02em;
  }
  .role { font-size: 34px; font-weight: 600; color: #6e6e73; }
  h1 { margin-top: 8px; font-size: 128px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; }
  .stack { margin-top: 28px; font-size: 32px; font-weight: 500; color: #6e6e73; }
  .url { position: absolute; bottom: 48px; font-size: 24px; color: #0066cc; }
</style>
</head>
<body>
  <p class="role">Senior Data Engineer at Accenture</p>
  <h1>Pramod Kadam</h1>
  <p class="stack">Apache Spark · Hadoop · Google Cloud</p>
  <p class="url">pramod21kadam.github.io</p>
</body>
</html>
